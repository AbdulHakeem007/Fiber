<svg width="240" height="140" viewBox="0 0 240 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fiber Jumper Passive Site Icon</title>
  <desc id="desc">Transparent SVG showing two ODF ports connected by a passive fiber jumper, with a dark center name plate for readable labels.</desc>

  <defs>
    <linearGradient id="plate" x1="62" y1="38" x2="178" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="0.48" stop-color="#334155"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="connectorBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="fiberYellow" x1="22" y1="30" x2="218" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="0.18" stop-color="#FACC15"/>
      <stop offset="0.55" stop-color="#F59E0B"/>
      <stop offset="0.82" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#FFFFFF" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Passive jumper cable: no active node, just a looped fiber patch cord -->
  <path d="M45 69 C61 25 92 17 120 17 C148 17 179 25 195 69" stroke="#92400E" stroke-width="15" stroke-linecap="round" opacity="0.28"/>
  <path d="M45 69 C61 25 92 17 120 17 C148 17 179 25 195 69" stroke="url(#fiberYellow)" stroke-width="10" stroke-linecap="round"/>
  <path d="M45 69 C61 25 92 17 120 17 C148 17 179 25 195 69" stroke="#FFF7CC" stroke-width="3" stroke-linecap="round" opacity="0.72"/>

  <!-- Center name plate: intentionally clean/dark so site name can be embossed/read on top by the app -->
  <g filter="url(#softShadow)">
    <rect x="58" y="43" width="124" height="58" rx="18" fill="url(#plate)"/>
    <rect x="63" y="48" width="114" height="48" rx="14" stroke="#94A3B8" stroke-opacity="0.42" stroke-width="1.5"/>
    <path d="M78 61 H162" stroke="#CBD5E1" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/>
    <path d="M82 84 H158" stroke="#020617" stroke-opacity="0.38" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Left ODF port and connector -->
  <g filter="url(#softShadow)">
    <rect x="16" y="48" width="34" height="44" rx="9" fill="url(#port)"/>
    <rect x="24" y="58" width="18" height="24" rx="4" fill="#0F172A" opacity="0.86"/>
    <rect x="43" y="60" width="25" height="20" rx="5" fill="url(#connectorBlue)"/>
    <rect x="55" y="64" width="13" height="12" rx="3" fill="#E0F2FE" opacity="0.88"/>
    <circle cx="33" cy="70" r="5" fill="#22C55E"/>
  </g>

  <!-- Right ODF port and connector -->
  <g filter="url(#softShadow)">
    <rect x="190" y="48" width="34" height="44" rx="9" fill="url(#port)"/>
    <rect x="198" y="58" width="18" height="24" rx="4" fill="#0F172A" opacity="0.86"/>
    <rect x="172" y="60" width="25" height="20" rx="5" fill="url(#connectorBlue)"/>
    <rect x="172" y="64" width="13" height="12" rx="3" fill="#E0F2FE" opacity="0.88"/>
    <circle cx="207" cy="70" r="5" fill="#22C55E"/>
  </g>

  <!-- Short straight jumper sections entering the ports -->
  <path d="M68 70 H89" stroke="#FACC15" stroke-width="8" stroke-linecap="round"/>
  <path d="M151 70 H172" stroke="#FACC15" stroke-width="8" stroke-linecap="round"/>
  <path d="M68 70 H89" stroke="#FFF7CC" stroke-width="2.5" stroke-linecap="round" opacity="0.76"/>
  <path d="M151 70 H172" stroke="#FFF7CC" stroke-width="2.5" stroke-linecap="round" opacity="0.76"/>

  <!-- Passive / through-cross-connect symbol, subtle so app text remains readable -->
  <g opacity="0.24" filter="url(#emboss)">
    <path d="M96 72 C106 60 134 60 144 72" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
    <path d="M96 72 C106 84 134 84 144 72" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
